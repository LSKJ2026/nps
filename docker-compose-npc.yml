services:
  npc:
    build:
      context: .
      dockerfile: Dockerfile.npc
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    image: npc-local:latest
    container_name: npc
    restart: unless-stopped
    command:
      - -config=/conf/npc.conf
    volumes:
      - ./conf:/conf:ro
